name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode strings.xml
        run: echo "${{ secrets.NAVER_SOCIAL_LOGIN }}" | base64 --decode > android/app/src/main/res/values/strings.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug
