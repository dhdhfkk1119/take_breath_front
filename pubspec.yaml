name: take_breath
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  # State Management & HTTP
  flutter_riverpod: ^2.3.6
  http: ^1.1.0
  dio: ^5.2.0

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.1  # 파일 저장 경로
  archive: ^3.4.9        # ZIP 압축
  pdf: ^3.10.7           # PDF 생성
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  flutter_svg: ^2.2.0
  mask_text_input_formatter: ^2.9.0
  url_launcher: ^6.3.2
  file_picker: ^6.0.0
  youtube_player_flutter: ^9.1.3
  flutter_inappwebview: ^6.0.0
  json_annotation: ^4.9.0
  logger: ^1.3.0

  vibration: ^1.9.0
  audioplayers: ^5.2.0
  shared_preferences: ^2.2.3
  freezed_annotation: ^2.4.1 # freezed가 생성하는 코드가 의존하는 패키지
  portone_flutter: ^0.12.1

  timeago: ^3.7.1 # 시간 포맷
  intl: 0.19.0 # 날짜·시간·숫자·통화 등의 포맷을 다루는 패키지
  # 로컬 + 앱이 꺼진 상태에서 도 -> push 알람 받기
  flutter_client_sse: ^2.0.3
  flutter_local_notifications: ^18.0.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_auth: ^6.1.2 # 소셜 로그인에 사용하는 firebase - auth


  web_socket_channel: ^3.0.3    # 웹소켓 채널 연결
  stomp_dart_client: ^2.1.3
  # google 소셜 로그인
  google_sign_in: ^7.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  build_runner: ^2.4.9     # 코드 생성을 실행하는 패키지
  json_serializable: ^6.8.0

  flutter_lints: ^5.0.0

dependency_overrides:
  logging: 1.2.0



flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/social/
    - assets/sounds/